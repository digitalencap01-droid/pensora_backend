<!DOCTYPE html>

<html
    lang="{{ language_code }}"
    dir="{{ text_direction }}"
>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <title>
        {{ seo.seo_title }}
    </title>


    <meta
        name="description"
        content="{{ seo.meta_description }}"
    >


    <link
        rel="canonical"
        href="{{ seo.canonical_url }}"
    >


    {% if seo.robots_meta %}
    <meta
        name="robots"
        content="{{ seo.robots_meta }}"
    >
    {% endif %}


    <!-- Open Graph -->

    <meta
        property="og:title"
        content="{{ seo.open_graph.title }}"
    >

    <meta
        property="og:description"
        content="{{ seo.open_graph.description }}"
    >

    <meta
        property="og:type"
        content="{{ seo.open_graph.type }}"
    >

    <meta
        property="og:url"
        content="{{ seo.open_graph.url }}"
    >

    <meta
        property="og:site_name"
        content="{{ seo.open_graph.site_name }}"
    >


    {% for image in seo.open_graph.images %}

    <meta
        property="og:image"
        content="{{ image }}"
    >

    {% endfor %}


    <!-- Twitter / X -->

    <meta
        name="twitter:card"
        content="{{ seo.twitter.card }}"
    >

    <meta
        name="twitter:title"
        content="{{ seo.twitter.title }}"
    >

    <meta
        name="twitter:description"
        content="{{ seo.twitter.description }}"
    >


    {% if seo.twitter.images %}

    <meta
        name="twitter:image"
        content="{{ seo.twitter.images[0] }}"
    >

    {% endif %}


    <!-- Structured Data -->

    <script type="application/ld+json">
{{ json_ld_json }}
    </script>


    <style>

        :root {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            line-height: 1.7;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #ffffff;
            color: #1f2937;
        }


        .page-container {
            width: min(
                100% - 32px,
                820px
            );

            margin: 0 auto;

            padding:
                64px
                0
                96px;
        }


        .ai-article h1 {
            margin:
                0
                0
                24px;

            font-size:
                clamp(
                    2rem,
                    5vw,
                    3.5rem
                );

            line-height: 1.1;
        }


        .ai-article h2 {
            margin:
                56px
                0
                16px;

            font-size: 1.75rem;
            line-height: 1.25;
        }


        .ai-article h3 {
            margin:
                32px
                0
                12px;

            font-size: 1.3rem;
        }


        .ai-article p {
            margin:
                0
                0
                20px;
        }


        .ai-article a {
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }


        .ai-article img {
            display: block;
            max-width: 100%;
            height: auto;
        }


        .featured-image {
            margin:
                32px
                0;
        }


        .featured-image img {
            width: 100%;
            border-radius: 12px;
        }


        .section-image {
            margin:
                32px
                0;
        }


        .section-image img {
            width: 100%;
            border-radius: 12px;
        }


        .table-of-contents {
            margin:
                40px
                0;

            padding:
                24px;

            border:
                1px solid #e5e7eb;

            border-radius: 12px;

            background: #f9fafb;
        }


        .table-of-contents h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }


        .table-of-contents ol {
            margin-bottom: 0;
        }


        blockquote {
            margin:
                28px
                0;

            padding:
                4px
                0
                4px
                20px;

            border-left:
                4px solid #d1d5db;
        }


        pre {
            overflow-x: auto;

            padding: 20px;

            border-radius: 8px;

            background: #111827;
            color: #f9fafb;
        }


        code {
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
        }


        table {
            width: 100%;

            margin:
                24px
                0;

            border-collapse:
                collapse;
        }


        th,
        td {
            padding: 12px;

            border:
                1px solid #e5e7eb;

            text-align: start;
        }


        th {
            background: #f9fafb;
        }


        .article-sources {
            margin-top: 64px;

            padding-top: 32px;

            border-top:
                1px solid #e5e7eb;
        }


        .article-sources li {
            margin-bottom: 12px;
        }


        @media (
            max-width: 600px
        ) {

            .page-container {
                width:
                    min(
                        100% - 24px,
                        820px
                    );

                padding-top: 36px;
            }

        }

    </style>

</head>


<body>

    <main class="page-container">

        {% include "partials/article_body.html" %}

    </main>

</body>

</html>
